site_name: "Yojaka AI"
site_description: "Production-grade LangGraph agentic candidate retrieval, deep screening, and interview intelligence platform."
site_author: "Shashank Chandel"
site_url: "https://shashankch.github.io/yojaka-ai-profile-matching-engine/"
repo_url: "https://github.com/shashankch/yojaka-ai-profile-matching-engine"
repo_name: "shashankch/yojaka-ai-profile-matching-engine"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

exclude_docs: |
  adr/README.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/lightbox.js

extra_css:
  - stylesheets/extra.css

nav:
  - Overview:
      - Introduction: index.md
      - Technical Architecture: architecture.md
      - State Machine: state_machine.md
      - Product Roadmap: ROADMAP.md
      - Engineering Conventions: CONVENTIONS.md
  - Architecture Decisions (ADRs):
      - ADR Catalog: adr/index.md
      - ADR-001 FastMCP Dual Gateway: adr/ADR-001-mcp-dual-mode-gateway-architecture.md
      - ADR-002 AgentState TypedDict: adr/ADR-002-using-typeddict-for-agentstate.md
      - ADR-003 BaseVectorStore Protocol: adr/ADR-003-basevectorstore-structural-protocol.md
      - ADR-004 BM25 Index Caching: adr/ADR-004-bm25-corpus-index-caching.md
      - ADR-005 Idempotent Upsert: adr/ADR-005-idempotent-upsert-ingestion.md
      - ADR-006 Celery Task Queue: adr/ADR-006-celery-redis-task-queue.md
      - ADR-007 Structured JSON Logging: adr/ADR-007-structured-json-logging-and-tracing.md
      - ADR-008 Multi-Factor Scoring: adr/ADR-008-multi-factor-hybrid-scoring-and-hierarchy.md
      - ADR-009 Intent Routing & Caching: adr/ADR-009-tiered-semantic-embedding-intent-routing.md
      - ADR-010 Indic LLM Abstraction: adr/ADR-010-multi-provider-sarvam-indic-llm.md
      - ADR-011 Stateless Credential Isolation: adr/ADR-011-stateless-credential-isolation.md
      - ADR-012 Functional State Immutability: adr/ADR-012-functional-state-immutability.md
      - ADR-013 Dynamic Skill Expansion: adr/ADR-013-dynamic-skills-taxonomy-alias-normalization.md
      - ADR-014 Concurrency Screening: adr/ADR-014-concurrency-controlled-async-screening.md
      - ADR-015 Provider Registry: adr/ADR-015-open-closed-llm-provider-registry.md
      - ADR-016 Zero-Disk In-Memory Ingestion: adr/ADR-016-zero-disk-in-memory-resume-ingestion.md
      - ADR-017 Layout Parsing & Two-Stage Rerank: adr/ADR-017-layout-parsing-contextual-retrieval-reranking.md
      - ADR-018 Calibrated Margin & Subgraphs: adr/ADR-018-calibrated-margin-routing-and-subgraphs.md
      - ADR-019 Advanced RAG & Local Inference: adr/ADR-019-advanced-rag-hyde-parent-doc-and-local-inference.md
  - Project & Community:
      - Contributing Guide: CONTRIBUTING.md
      - Changelog: CHANGELOG.md
      - License: LICENSE.md
