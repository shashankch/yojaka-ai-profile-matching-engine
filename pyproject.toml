[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_profile_matching"
version = "1.6.0"
description = "Yojaka AI: Production-grade Agentic Profile Matching Engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "chromadb>=1.5.9",
    "pysqlite3-binary; sys_platform == 'linux'",
    "sentence-transformers",
    "pypdf>=6.16.1",
    "pymupdf",
    "python-docx",
    "rank-bm25",
    "reportlab",
    "langgraph",
    "streamlit",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langchain-core",
    "langchain-community",
    "langchain-groq",
    "langchain-google-genai",
    "langchain-openai",
    "python-dotenv",
    "mcp>=1.0.0",
    "tavily-python>=0.5.0",
    "celery>=5.3.0",
    "redis>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/shashankch/yojaka-ai-profile-matching-engine"
Documentation = "https://shashankch.github.io/yojaka-ai-profile-matching-engine/"
Repository = "https://github.com/shashankch/yojaka-ai-profile-matching-engine"
Changelog = "https://github.com/shashankch/yojaka-ai-profile-matching-engine/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "diagrams>=0.23.0",
    "pillow>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_profile_matching*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["eval: RAG evaluation pipeline benchmark tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true



